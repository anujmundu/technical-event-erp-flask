{% extends "base.html" %}
{% block title %}Add Item{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title mb-4">Add New Item</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label" for="name">Product Name</label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="Product Name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="price">Price</label>
                        <input type="number" step="0.01" id="price" name="price" class="form-control" placeholder="Price" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="image">Image filename</label>
                        <input type="text" id="image" name="image" class="form-control" placeholder="Image filename">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Add Item</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="/vendor/dashboard">Back</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
