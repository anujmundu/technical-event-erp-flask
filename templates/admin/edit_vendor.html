{% extends "base.html" %}
{% block title %}Edit Vendor{% endblock %}
{% block content %}
<h2>Edit Vendor</h2>
<form method="POST" class="row g-3">
    <div class="col-md-4">
        <label class="form-label">Name</label>
        <input name="name" class="form-control" value="{{vendor.name}}" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Email</label>
        <input name="email" class="form-control" value="{{vendor.email}}" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Category</label>
        <select name="category" class="form-select">
            {% for c in categories %}
            <option value="{{c}}" {% if c == vendor.category %}selected{% endif %}>{{c}}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-primary">Update</button>
    </div>
</form>
{% endblock %}
