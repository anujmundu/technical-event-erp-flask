{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
<h2>Checkout</h2>
<form method="POST">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label" for="name">Full Name</label>
            <input id="name" name="name" class="form-control" placeholder="Full Name" required>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input id="email" name="email" type="email" class="form-control" placeholder="Email" required>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="phone">Phone Number</label>
            <input id="phone" name="phone" class="form-control" placeholder="Phone Number" required>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="address">Address</label>
            <input id="address" name="address" class="form-control" placeholder="Address" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="city">City</label>
            <input id="city" name="city" class="form-control" placeholder="City" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="state">State</label>
            <input id="state" name="state" class="form-control" placeholder="State" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="pincode">Pincode</label>
            <input id="pincode" name="pincode" class="form-control" placeholder="Pincode" required>
        </div>
        <div class="col-12">
            <label class="form-label">Payment Method</label>
            <select name="payment_method" class="form-select" required>
                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
            </select>
        </div>
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">Place Order</button>
    </div>
</form>
<div class="mt-3">
    <a class="btn btn-secondary" href="/user/cart">Back to Cart</a>
</div>
{% endblock %}
