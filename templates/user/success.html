{% extends "base.html" %}
{% block title %}Order Success{% endblock %}
{% block content %}
<div class="card text-center">
    <div class="card-body">
        <h2 class="card-title">Order Successful!</h2>
        <p>Order ID: {{order.id}}</p>
        <p>Total Amount: ₹{{order.total_amount}}</p>
        <p>Status: {{order.status}}</p>
        <a class="btn btn-primary mt-3" href="/user/dashboard">Continue Shopping</a>
    </div>
</div>
{% endblock %}
