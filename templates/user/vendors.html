{% extends "base.html" %}

{% block title %}Select Vendor{% endblock %}

{% block content %}
<h2>Select Vendor Category</h2>
<form method="GET" class="row g-3 mb-4">
    <div class="col-md-8">
        <select name="category" class="form-select">
            <option value="">-- Select Category --</option>
            {% for c in categories %}
                <option value="{{c.name}}" {% if request.args.get('category') == c.name %}selected{% endif %}>
                    {{c.name}}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <button class="btn btn-primary w-100">View Vendors</button>
    </div>
</form>
<hr>
{% if vendors %}
    <div class="list-group">
    {% for v in vendors %}
        <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <strong>{{v.name}}</strong> ({{v.category}})
            </div>
            <a class="btn btn-sm btn-success" href="/user/products/{{v.id}}">View Products</a>
        </div>
    {% endfor %}
    </div>
{% else %}
    <p>No vendors available for selected category.</p>
{% endif %}

<div class="mt-4">
    <a class="btn btn-secondary" href="/user/dashboard">Back</a>
</div>
{% endblock %}
