{% extends "base.html" %}

{% block title %}Message{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="alert alert-info text-center" role="alert">
            {{ message }}
        </div>
        {% if back_url %}
        <div class="text-center mt-3">
            <a class="btn btn-secondary" href="{{ back_url }}">Back</a>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
